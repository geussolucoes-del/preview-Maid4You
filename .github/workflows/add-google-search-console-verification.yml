name: One-time Google Search Console verification

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Google verification meta tag
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          token = "GB7nHo4zYgYuQGGiWdTlgQGXYcfZy6UOe5imqhg1GEU"
          tag = f'<meta name="google-site-verification" content="{token}" />'

          if token not in html:
              lower = html.lower()
              head_start = lower.find("<head")
              if head_start == -1:
                  raise SystemExit("No <head> element found in index.html")
              head_end = html.find(">", head_start)
              if head_end == -1:
                  raise SystemExit("Malformed <head> element in index.html")
              html = html[:head_end + 1] + "\n  " + tag + html[head_end + 1:]
              path.write_text(html, encoding="utf-8")
          PY

      - name: Remove one-time workflow
        shell: bash
        run: rm -f .github/workflows/add-google-search-console-verification.yml

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-google-search-console-verification.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Add Google Search Console verification"
          git push
